# Static build: node build.mjs renders src/ into dist/.
[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Lead delivery to HubSpot. Needs HUBSPOT_TOKEN set under Site configuration >
# Environment variables, with the crm.objects.contacts.write scope.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Photos rarely change; let browsers cache them for a week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Stylesheet and script are cache busted with ?v= on every build.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Reno was folded into the homepage in November 2026. The two pages were
# competing for the same search, so there is one page for it now.
[[redirects]]
  from = "/pressure-washing-reno"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pressure-washing-reno/*"
  to = "/"
  status = 301
  force = true

# Both forms post their lead here.
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200

# Retired service. Not offered, so the old route points at the service area.
[[redirects]]
  from = "/hood-vent-cleaning"
  to = "/service-area/"
  status = 301
  force = true

[[redirects]]
  from = "/hood-vent-cleaning/*"
  to = "/service-area/"
  status = 301
  force = true

# Driveway Makeover Contest lives at /driveway. The old path and the short
# URLs point at it. Netlify passes the query string through, so UTM tags on
# the QR code survive the redirect. /driveway itself is never redirected.
[[redirects]]
  from = "/driveway-makeover"
  to = "/driveway/"
  status = 301
  force = true

[[redirects]]
  from = "/driveway-makeover/*"
  to = "/driveway/"
  status = 301
  force = true

[[redirects]]
  from = "/spa"
  to = "/driveway/"
  status = 301
  force = true

[[redirects]]
  from = "/makeover"
  to = "/driveway/"
  status = 301
  force = true

# Old domain to the new one, path preserved. These take effect once both
# domains are pointed at this site in Netlify.
[[redirects]]
  from = "https://rollingsudsrenotahoe.com/*"
  to = "https://rollingsudsreno.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.rollingsudsrenotahoe.com/*"
  to = "https://rollingsudsreno.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.rollingsudsreno.com/*"
  to = "https://rollingsudsreno.com/:splat"
  status = 301
  force = true
